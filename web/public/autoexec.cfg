// =====================================================================
//  Riverside PUG - autoexec.cfg for Left 4 Dead (1)
//
//  WHERE THIS GOES
//    Steam/steamapps/common/left 4 dead/left4dead/cfg/autoexec.cfg
//
//    On Windows that is usually
//      C:\Program Files (x86)\Steam\steamapps\common\left 4 dead\left4dead\cfg
//    If a file is already there, keep a copy before you overwrite it.
//
//    It runs by itself every time the game starts. Nothing to type.
//
//  WHY YOU WANT IT
//    The rates block below is the part that matters. Riverside runs at
//    100 tick, and an L4D1 client ignores rate settings the server tries
//    to push to it, so these have to be set on your own machine. Without
//    them your hit registration is measurably worse than everyone
//    else's and there is nothing the server can do about it.
//
//    Everything under the rates is preference. Change any of it.
//
//  ALSO SET YOUR LAUNCH OPTIONS
//    This file cannot do it for you. In Steam, right-click Left 4 Dead ->
//    Properties -> Launch Options:
//
//      -lv -novid -forcenovsync -mat_queue_mode 2 -useforcedmparms
//      -noforcemaccel -noforcemspd -refresh 60
//
//    (all on one line; change -refresh to your monitor's rate)
//
//    -lv is the one that changes how the game plays. Without it, hittables
//    drift out of line with their own hitboxes, so the car you are swinging
//    at is not where the game thinks it is.
// =====================================================================


// ---------------------------------------------------------------------
//  RATES - set these and leave them alone
//
//  100, not 128. L4D1's engine hard-caps updates at 100 per second: ask
//  for 128 and the server replies "the real value is 128 but the server
//  has temporarily restricted it to 100". Asking for more than the
//  engine will give you buys nothing and makes your own console lie to
//  you about what you are running.
// ---------------------------------------------------------------------
rate                        "100000"
cl_updaterate               "100"
cl_cmdrate                  "100"
cl_interp                   "0"
cl_interp_ratio             "0"
cl_lagcompensation          "1"
cl_resend                   "1.5"
net_splitrate               "3"
net_splitpacket_maxrate     "100000"
net_allow_multicast         "0"
cl_timeout                  "70"


// ---------------------------------------------------------------------
//  NETGRAPH ON TAB
//  Holding the scoreboard key also shows the net graph, so you can check
//  your own ping and loss mid-round without a second bind.
// ---------------------------------------------------------------------
bind "TAB" "+tabstat"
alias +tabstat "+showscores; net_graph 3"
alias -tabstat "-showscores; net_graph 0"


// ---------------------------------------------------------------------
//  MATCH BINDS
//  The plugin commands you need during a PUG, on one key each.
// ---------------------------------------------------------------------
bind "F5" "say_team !ready"
bind "F6" "say_team !unready"
bind "F7" "record 0; stop"
bind "h"  "say_team !health"
bind "j"  "say_team !tank"
bind "k"  "say_team !mvp"


// ---------------------------------------------------------------------
//  MOUSE
//  Yours. Set it to whatever you already play on: a sensitivity that is
//  not yours is the single most disorienting thing in this file.
// ---------------------------------------------------------------------
sensitivity                 "1.1"


// ---------------------------------------------------------------------
//  DIRECTIONAL SOUND
//  Movement keys also zero dsp_volume, which stops the game muffling
//  footsteps and special infected audio when you take damage or walk
//  through certain spaces. Rebind W/A/S/D here, not in the menu, or the
//  aliases stop firing.
// ---------------------------------------------------------------------
bind "W" "+mfwd"
bind "A" "+mleft"
bind "S" "+mback"
bind "D" "+mright"
alias +mfwd   "dsp_volume 0;-back;+forward;alias checkfwd +forward"
alias +mback  "dsp_volume 0;-forward;+back;alias checkback +back"
alias +mleft  "dsp_volume 0;-moveright;+moveleft;alias checkleft +moveleft"
alias +mright "dsp_volume 0;-moveleft;+moveright;alias checkright +moveright"
alias -mfwd   "-forward;checkback;alias checkfwd none"
alias -mback  "-back;checkfwd;alias checkback none"
alias -mleft  "-moveleft;checkright;alias checkleft none"
alias -mright "-moveright;checkleft;alias checkright none"
alias checkfwd   "none"
alias checkback  "none"
alias checkleft  "none"
alias checkright "none"
alias none " "

dsp_enhance_stereo          "0"
dsp_slow_cpu                "0"
snd_prefetch_common         "1"
snd_mixahead                "0.05"
snd_pitchquality            "1"


// ---------------------------------------------------------------------
//  CROSSHAIR
//  Preference, all of it.
//
//  NOTE: cl_crosshair_alpha 0 means NO CROSSHAIR. That is deliberate
//  here, but if you loaded in and wondered where it went, this is why.
//  Put it back with cl_crosshair_alpha 255.
// ---------------------------------------------------------------------
cl_crosshair_dynamic        "0"
cl_colorblind               "1"
cl_crosshair_red            "255"
cl_crosshair_green          "255"
cl_crosshair_blue           "255"
cl_crosshair_alpha          "0"
cl_crosshair_thickness      "2"


// ---------------------------------------------------------------------
//  MISC
// ---------------------------------------------------------------------
con_enable                  "1"      // console on, you need it to connect
cl_showhelp                 "0"
cl_autohelp                 "0"
gameinstructor_enable       "0"      // the tutorial popups
cl_showpluginmessages       "0"
cl_predictweapons           "1"
cl_allowdownload            "0"
cl_allowupload              "0"
cl_downloadfilter           "nosounds"  // skip custom sound downloads
spec_allowroaming           "1"      // free look while spectating
cam_ideallag                "0"
voice_enable                "1"
mat_monitorgamma_tv_enabled "1"
muzzleflash_light           "0"
func_break_max_pieces       "0"      // less debris and fewer gibs
mat_grain_scale_override    "0"      // film grain off
budget_show_history         "0"


// ---------------------------------------------------------------------
//  GLOWS
//  Preference. These are the outline colours for teammates, items and
//  infected.
// ---------------------------------------------------------------------
cl_glow_ability_r "1"
cl_glow_ability_g "0"
cl_glow_ability_b "0"
cl_glow_ability_colorblind_r "1"
cl_glow_ability_colorblind_g "0"
cl_glow_ability_colorblind_b "0"
cl_glow_ghost_infected_r "0.8"
cl_glow_ghost_infected_g "0.8"
cl_glow_ghost_infected_b "0.8"
cl_glow_infected_r "0"
cl_glow_infected_g "0.498"
cl_glow_infected_b "1"
cl_glow_infected_vomit_r "0.7607"
cl_glow_infected_vomit_g "0.0431"
cl_glow_infected_vomit_b "0.6862"
cl_glow_item_r "0.3568"
cl_glow_item_g "0.9607"
cl_glow_item_b "0.8235"
cl_glow_item_far_r "0.3490"
cl_glow_item_far_g "0.9607"
cl_glow_item_far_b "0.8235"
cl_glow_survivor_r "0"
cl_glow_survivor_g "0.498"
cl_glow_survivor_b "1"
cl_glow_survivor_health_high_r "0.0352"
cl_glow_survivor_health_high_g "0.6862"
cl_glow_survivor_health_high_b "0.1921"
cl_glow_survivor_health_high_colorblind_r "0.0352"
cl_glow_survivor_health_high_colorblind_g "0.6862"
cl_glow_survivor_health_high_colorblind_b "0.1921"
cl_glow_survivor_health_med_r "0.5882"
cl_glow_survivor_health_med_g "0.4784"
cl_glow_survivor_health_med_b "0.0313"
cl_glow_survivor_health_med_colorblind_r "0.5882"
cl_glow_survivor_health_med_colorblind_g "0.4784"
cl_glow_survivor_health_med_colorblind_b "0.0313"
cl_glow_survivor_health_low_r "0.6274"
cl_glow_survivor_health_low_g "0.0941"
cl_glow_survivor_health_low_b "0.0941"
cl_glow_survivor_health_low_colorblind_r "0.6980"
cl_glow_survivor_health_low_colorblind_g "0.2470"
cl_glow_survivor_health_low_colorblind_b "0"
cl_glow_survivor_hurt_r "0.9725"
cl_glow_survivor_hurt_g "0.4352"
cl_glow_survivor_hurt_b "0.0941"
cl_glow_survivor_vomit_r "0.7647"
cl_glow_survivor_vomit_g "0.0117"
cl_glow_survivor_vomit_b "0.6901"
cl_glow_thirdstrike_item_r "1"
cl_glow_thirdstrike_item_g "0"
cl_glow_thirdstrike_item_b "0"
cl_glow_thirdstrike_item_colorblind_r "1"
cl_glow_thirdstrike_item_colorblind_g "0"
cl_glow_thirdstrike_item_colorblind_b "0"


// ---------------------------------------------------------------------
//  FRAMERATE
//  Turns off effects that cost frames and buy nothing competitively.
// ---------------------------------------------------------------------
cl_forcepreload             "1"
mat_hdr_enabled             "0"
r_cheapwaterend             "1"
r_cheapwaterstart           "1"
r_eyemove                   "0"
r_dynamic                   "0"
r_PhysPropStaticLighting    "0"
mat_bloom_scalefactor_scalar "0.5"

clear
