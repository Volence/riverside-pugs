// skypounce playtest: one human as a hunter against idle survivor bots.
hostname "skypounce playtest (local)"
sv_lan 1
sv_cheats 1
sv_hibernate_when_empty 0
sv_consistency 0
sv_pure 0
// rcon_password is appended by start.sh, a fresh random one per run.
sb_all_bot_team 1
sb_stop 1
god 1
z_common_limit 0
director_no_mobs 1
director_no_bosses 1
director_no_death_check 1
// L4D1 names (the z_versus_* and z_ghost_delay_* cvars are L4D2 only).
z_gas_limit 0
z_exploding_limit 0
z_hunter_limit 4
z_ghost_spawn_in_start 1
z_ghost_spawn_interval 1
z_ghost_checkpoint_spawn_interval 1
l4d_skypounce_enable 1
l4d_skypounce_debug 1
log on
