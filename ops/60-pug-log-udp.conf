# Dallas: let pug-web's log listener (UDP :27500) have the 16 MB receive buffer
# it asks for (src/logListener.ts). The kernel default of 208 KB held about 150
# log lines and dropped bursts; match 1143 (2026-11-12) lost its MATCH_END that way.
# Install: cp to /etc/sysctl.d/ and `sysctl --system`, then restart pug-web.
net.core.rmem_max = 16777216
